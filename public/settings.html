<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KORUS Toolkit 설정</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: #f7f8fa;
        color: #202124;
      }

      main {
        box-sizing: border-box;
        width: min(640px, 100%);
        margin: 0 auto;
        padding: 32px 24px;
      }

      label,
      textarea,
      button {
        display: block;
      }

      textarea {
        box-sizing: border-box;
        width: 100%;
        margin-top: 8px;
        padding: 10px;
        font: inherit;
        resize: vertical;
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      button {
        padding: 8px 14px;
      }

      #settings-status {
        min-height: 1.5em;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>KORUS Toolkit 설정</h1>
      <form id="settings-form">
        <label for="prefill-phrase">업무메일 프리필 문구</label>
        <textarea
          id="prefill-phrase"
          name="prefillPhrase"
          rows="7"
          autocomplete="off"
          spellcheck="false"
        ></textarea>
        <div class="actions">
          <button type="submit">저장</button>
          <button id="clear-button" type="button">초기화</button>
        </div>
        <p id="settings-status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script type="module" src="./settings.js"></script>
  </body>
</html>
